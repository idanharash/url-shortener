services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    environment:
      Postgres__Host: db
      Postgres__Database: ${POSTGRES_DB:-url_shortener}
      Postgres__Username: ${POSTGRES_USER:-postgres}
      Postgres__Password: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # Merged into the web and worker services from docker-compose.yml: start them only after migrations succeed.
  web:
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    depends_on:
      migrate:
        condition: service_completed_successfully

  jaeger:
    image: jaegertracing/all-in-one:1.51
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
