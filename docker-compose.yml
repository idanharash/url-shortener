services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-urlshortener}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env (see .env.example)}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      App__PublicBaseUrl: http://localhost:5000
      Postgres__Host: db
      Postgres__Database: ${POSTGRES_DB:-url_shortener}
      Postgres__Username: ${POSTGRES_USER:-postgres}
      Postgres__Password: ${POSTGRES_PASSWORD}
      Redis__ConnectionString: redis:6379
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-urlshortener}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      OpenTelemetry__OtlpEndpoint: http://jaeger:4317
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Consumes click events and stores them. Scale with: docker compose up -d --scale worker=3
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    ports:
      - "9091"   # /metrics on a random host port (so several replicas don't clash): docker compose port worker 9091
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Postgres__Host: db
      Postgres__Database: ${POSTGRES_DB:-url_shortener}
      Postgres__Username: ${POSTGRES_USER:-postgres}
      Postgres__Password: ${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-urlshortener}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      OpenTelemetry__ServiceName: UrlShortener.Worker
      OpenTelemetry__OtlpEndpoint: http://jaeger:4317
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
